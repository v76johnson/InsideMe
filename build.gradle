// Root-level configuration file.
// Global plugin versions are declared here (apply false) and applied per-module.
//
// Toolchain alignment (Strategy B - stable, JDK 17 compatible):
//   AGP      8.7.3   -> requires Gradle 8.9+ (workflow provides Gradle via setup-gradle)
//   Kotlin   2.0.21  -> Compose compiler plugin 2.0.21 ships with KGP 2.0.x
//   JDK      17      -> provided by setup-java@v4 in the CI workflow
//
// NOTE: With Kotlin 2.0+ the Jetpack Compose compiler is a standalone Gradle
// plugin (org.jetbrains.kotlin.plugin.compose). It must be declared here with
// `apply false` AND applied inside app/build.gradle. Declaring it here alone
// is NOT enough - that was the root cause of the "Composable Compiler gradle
// plugin is required" build failure.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
}
