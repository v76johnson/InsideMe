// Rule 4: Root-level configuration file remains empty of application code.
// All plugins, dependencies, and signing configurations are handled strictly within app/build.gradle.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'com.android.application' version '9.1.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
