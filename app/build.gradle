plugins {
    id 'com.android.application'
    // Explicit 'org.jetbrains.kotlin.android' plugin declaration removed to bypass the extension registration conflict in Gradle 9.3+
}

android {
    namespace 'com.v76jo.insideme'
    compileSdk 34

    defaultConfig {
        applicationId "com.v76jo.insideme"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Rule 5: Fallback local system directory signing key lookup block for Groovy
        debug {
            def userHome = System.getProperty("user.home")
            def keystoreFile = file("${userHome}/.android/debug.keystore")
            
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
